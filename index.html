
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="../week4/style.css">
</head>
<body>

    <h1>Image Slider Library</h1>

    <div class="slider">
        <div class="slides" id="slides">
            <img src="./images.jpg" alt="Mountain">
<img src="./images%20(1).jpg" alt="Forest">
<img src="./images%20(2).jpg" alt="Nature">
        </div>

        <button class="prev" onclick="prevSlide()">&#10094;</button>
        <button class="next" onclick="nextSlide()">&#10095;</button>
    </div>

    <div class="dots" id="dots"></div>

    <script src="../week4/slider.js"></script>
</body>
</html>
